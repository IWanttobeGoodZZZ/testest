<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --google-blue: #1A73E8;
      --soft-blue: #F1F3F4;
      --active-blue: #185ABC;
      --text-gray: #3C4043;
    }
    
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #FFFFFF;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      color: var(--text-gray);
    }
    
    .main-container {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border: 1px solid #DADCE0;
      border-radius: 16px;
      text-align: center;
    }
    
    h2 { color: var(--google-blue); font-weight: 700; margin-bottom: 25px; }
    
    .field { text-align: left; margin-bottom: 18px; }
    
    label { font-size: 13px; font-weight: 700; color: #70757A; margin-left: 5px; }
    
    input, select {
      width: 100%;
      padding: 12px 15px;
      margin-top: 6px;
      border: 1px solid #DADCE0;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }
    
    input:focus { border-color: var(--google-blue); outline: none; }
    
    button {
      width: 100%;
      padding: 14px;
      background-color: var(--google-blue);
      color: white;
      border: none;
      border-radius: 25px; /* 라운드 스타일 */
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 15px;
      transition: 0.2s;
    }
    
    button:hover { background-color: var(--active-blue); }
    button:disabled { background-color: #E8EAED; color: #9AA0A6; cursor: not-allowed; }
    
    #loading { display: none; margin-top: 20px; color: var(--google-blue); font-size: 14px; }
    
    #result-area {
      display: none;
      margin-top: 25px;
      padding: 20px;
      background-color: #F8F9FA;
      border-radius: 12px;
      text-align: left;
    }
    
    .res-title { font-size: 18px; font-weight: 700; color: var(--google-blue); margin-bottom: 8px; display: block; }
    .res-body { font-size: 14px; line-height: 1.6; color: #202124; }
  </style>
</head>
<body>

<div class="main-container">
  <h2>Gemini 3 MBTI</h2>
  
  <div class="field">
    <label>성함</label>
    <input type="text" id="name" placeholder="이름을 입력하세요">
  </div>
  
  <div class="field">
    <label>자신의 MBTI</label>
    <select id="mbti">
      <option>INFP</option><option>INFJ</option><option>INTP</option><option>INTJ</option>
      <option>ISFP</option><option>ISFJ</option><option>ISTP</option><option>ISTJ</option>
      <option>ENFP</option><option>ENFJ</option><option>ENTP</option><option>ENTJ</option>
      <option>ESFP</option><option>ESFJ</option><option>ESTP</option><option>ESTJ</option>
    </select>
  </div>
  
  <div class="field">
    <label>분석 목적</label>
    <select id="type">
      <option value="좋은 궁합">최고의 파트너 찾기</option>
      <option value="나쁜 궁합">주의해야 할 상극 찾기</option>
    </select>
  </div>
  
  <button id="submitBtn" onclick="runAnalysis()">분석 결과 확인</button>
  
  <div id="loading">Gemini 3 Flash가 실시간 분석 중...</div>
  
  <div id="result-area">
    <span id="targetText" class="res-title"></span>
    <div id="reasonText" class="res-body"></div>
  </div>
</div>

<script>
  function runAnalysis() {
    const name = document.getElementById('name').value;
    const mbti = document.getElementById('mbti').value;
    const type = document.getElementById('type').value;
    const btn = document.getElementById('submitBtn');
    
    if(!name) { alert('성함을 입력해 주세요.'); return; }
    
    btn.disabled = true;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('result-area').style.display = 'none';
    
    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        document.getElementById('loading').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('targetText').innerText = "결과: " + res.target;
        document.getElementById('reasonText').innerText = res.reason;
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        document.getElementById('loading').style.display = 'none';
        alert('서버 통신 오류가 발생했습니다.');
      })
      .processForm({name: name, mbti: mbti, type: type});
  }
</script>

</body>
</html>
